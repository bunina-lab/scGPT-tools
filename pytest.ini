# Run with:
#   PYTHONNOUSERSITE=1 python -m pytest
#
# PYTHONNOUSERSITE is required because ~/.local/lib/python3.10/site-packages
# holds a langsmith/pydantic install that is incompatible with this env's
# typing_extensions and breaks pytest's plugin autoload. The SLURM job scripts
# set the same variable for the same reason.
[pytest]
testpaths = tests
